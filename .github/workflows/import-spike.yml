name: import-spike

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID
        required: true
        default: eIho2S0ZahI
      lang:
        description: Subtitle language
        required: true
        default: en

jobs:
  fetch-subs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@v6

      - name: List available subtitles
        run: |
          uvx yt-dlp --skip-download --list-subs \
            "https://youtu.be/${{ inputs.video_id }}" 2>&1 | head -30

      - name: Fetch auto captions (json3)
        run: |
          uvx yt-dlp --skip-download --write-auto-subs \
            --sub-langs "${{ inputs.lang }}" --sub-format json3 \
            -o "captions" "https://youtu.be/${{ inputs.video_id }}"
          ls -la captions.*
          echo "--- head of json3 ---"
          head -c 500 "captions.${{ inputs.lang }}.json3"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: captions-${{ inputs.video_id }}
          path: captions.*
